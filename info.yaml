project:
  title:        ""      Hazael Elevator
  author:       ""       Hazael Loranca
  discord:      ""       Your Discord username, for communication and automatic Tapeout role assignment (optional)
  description:  ""       Elevator that moves up floors when a push button is pressed
  language:            "Verilog"
  clock_hz:             0      

  # How many tiles does your design occupy? A single tile is approximately 167x108 µm.
  tiles: "1x1"        

  # Your top module name must start with "tt_um_". Make it unique by including your GitHub username:
  top_module:  "tt_um_elevador_hazael"

  # List your project's source files here.
  # Source files must be in ./src and you must list each file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "elevador.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "boton"
  ui[1]: "clock_hz"
  ui[2]: "dato"


  # Outputs
  uo[0]: "motorsubir"
  uo[1]: "motorbajar"
  uo[2]: "display"
 


yaml_version: 6
